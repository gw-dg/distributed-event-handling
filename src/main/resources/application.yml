# ─────────────────────────────────────────────────────────────────────────────
# application.yml  —  Distributed Task Queue, Phase 4
#
# This file holds safe defaults suitable for local development.
# Override individual values per environment via env vars or profile YMLs.
#   - application-local.yml   (local dev, in-memory queue)
#   - application-prod.yml    (production, postgres queue)
#   - Environment variables:  TASKQUEUE_WORKERS_COUNT=8 java -jar ...
#   - Command-line args:      --taskqueue.workers.count=8
#
# Spring property resolution order (later overrides earlier):
#   1. application.yml  2. profile yml  3. env vars  4. CLI args
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: distributed-task-queue

  # ── Redis (Phase 4) ────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2

  # ── Scheduling (Phase 4: outbox relay, leader-elected scheduler) ────────────
  task:
    scheduling:
      enabled: true

  # ── DataSource (HikariCP, auto-configured by Spring Boot) ──────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/taskqueue
    username: taskqueue
    password: taskqueue
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TaskQueuePool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── Flyway (schema migration) ──────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Jackson ───────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ── Graceful shutdown (Phase 3) ────────────────────────────────────────────
  # On SIGTERM: stop accepting new requests, wait up to 30s for in-flight tasks
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ─────────────────────────────────────────────────────────────────────────────
# Task Queue settings  (bound to TaskQueueProperties)
# ─────────────────────────────────────────────────────────────────────────────
taskqueue:

  queue:
    # "memory"       -> InMemoryTaskQueue  (local/test)
    # "postgres"     -> PostgresTaskQueue  (production Phase 2/3)
    # "redis-stream" -> RedisStreamTaskQueue (production Phase 4)
    type: redis-stream
    capacity: 10000
    poll-batch-size: 25
    # Phase 4: Redis Streams consumer group name
    consumer-group: ${CONSUMER_GROUP:workers}
    # Phase 4: unique node ID per worker container
    consumer-name: ${WORKER_ID:worker-0}
    # Phase 4: how long a lease may stay un-acked before reclaim (milliseconds)
    visibility-timeout-ms: 30000

  workers:
    count: 4
    shutdown-timeout: 30s

  retry:
    max-attempts: 5
    base-delay: 1s
    max-delay: 5m
    jitter: true

  reaper:
    # How often to scan for stuck RUNNING tasks
    interval: PT30S
    # Tasks stuck in RUNNING for longer than this are reclaimed
    visibility-timeout: 5m

  # ── Phase 4: Outbox Relay ───────────────────────────────────────────────────
  outbox:
    # How often the relay polls for unpublished rows (only the elected leader runs this)
    poll-interval: 250
    # Rows per relay batch
    batch-size: 50

  # ── Phase 4: Leader Election ────────────────────────────────────────────────
  leader:
    # Each node's unique ID — override via env var in Docker
    node-id: ${WORKER_ID:local-node}
    # Redis key TTL for the leader lock (must be > heartbeat interval)
    ttl-ms: 10000
    # Heartbeat / renewal interval
    heartbeat-ms: 3000

  # ── Phase 4: EventBus ───────────────────────────────────────────────────────
  event-bus:
    # "in-process" -> InProcessEventBus (single-node, tests)
    # "redis"      -> RedisEventBus (multi-node pub/sub)
    type: ${EVENT_BUS_TYPE:redis}
    # Redis pub/sub channel name
    channel: task-events

  # ── Phase 3: Token Bucket Rate Limiter ─────────────────────────────────────
  # capacity: bucket size (also the maximum burst)
  # refill-rate: tokens added per second (sustained request rate)
  # Clients that exceed this get HTTP 429 with Retry-After: 1
  rate-limit:
    capacity: 100
    refill-rate: 10

  # ── Phase 3: Circuit Breaker ───────────────────────────────────────────────
  # Breakers are per task type (one "email" breaker, one "report" breaker, etc.)
  # sliding-window-size: evaluate failure rate over last N calls
  # failure-rate-threshold: open if >= X% of window calls failed
  # wait-duration-open: how long to stay OPEN before probing
  resilience:
    sliding-window-size: 10
    failure-rate-threshold: 50
    wait-duration-open: PT10S

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8080
  shutdown: graceful   # Phase 3: drain in-flight requests before stopping
  error:
    # Prevent Spring's default /error page from exposing stack traces
    include-stacktrace: never
    include-message: never

# ─────────────────────────────────────────────────────────────────────────────
# Actuator (Phase 3)
# ─────────────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # health, prometheus: public-facing; metrics: debugging
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Show component details in /actuator/health response (useful locally)
      show-details: always
  # Tag all metrics with the application name for multi-service Prometheus setups
  metrics:
    tags:
      application: ${spring.application.name}

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
logging:
  level:
    com.taskqueue: INFO
    org.springframework.jdbc: INFO
    org.flywaydb: INFO
    # Resilience4j state transitions are worth knowing about
    io.github.resilience4j: INFO
